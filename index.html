<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargando Sistema...</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'><path fill='%233b82f6' d='M400 224h-24v-72C376 68.2 307.8 0 224 0S72 68.2 72 152v72H48c-26.5 0-48 21.5-48 48v192c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48V272c0-26.5-21.5-48-48-48zm-104 0H152v-72c0-39.7 32.3-72 72-72s72 32.3 72 72v72z'/></svg>">
    <style>body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }</style>
</head>
<body>
    <div id="mensaje">Conectando con el servidor seguro...</div>

    <script>
        // Tu URL de Google Script integrada perfectamente
        const URL_API = "https://script.google.com/macros/s/AKfycbwEfY1yAJXQEpoALeSHHHhHwJNcSHXUjxmKUt7PukkmkgQTrKTBeOlTFKtAAU5bjOPN/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const idSistema = urlParams.get('id');

        if(idSistema) {
            fetch(URL_API + "?id=" + idSistema)
            .then(respuesta => respuesta.json())
            .then(datos => {
                if(datos.success) {
                    document.open();
                    document.write(datos.html);
                    document.close();
                } else {
                    document.getElementById('mensaje').innerText = "Error: " + datos.mensaje;
                }
            }).catch(() => document.getElementById('mensaje').innerText = "Error de conexión.");
        } else {
            document.getElementById('mensaje').innerText = "Acceso Denegado. Faltan credenciales en el enlace.";
        }
    </script>
</body>
</html>
